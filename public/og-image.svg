<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#080C14"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="600" cy="200" r="400" fill="#38BDF8" fill-opacity="0.08"/>
  <circle cx="850" cy="350" r="300" fill="#818CF8" fill-opacity="0.05"/>
  
  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Status Badge -->
  <g transform="translate(100, 120)">
    <rect width="260" height="36" rx="18" fill="rgba(15,23,42,0.8)" stroke="rgba(56,189,248,0.3)"/>
    <circle cx="20" cy="18" r="4" fill="#38BDF8"/>
    <text x="36" y="23" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">AI CONTENT AUTOMATION</text>
  </g>

  <!-- Big Title -->
  <text x="100" y="250" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">
    Build Once.
  </text>
  <text x="100" y="330" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">
    Automate More.
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="400" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="24" font-weight="400">
    Turn one source into a complete content workflow — powered by AI.
  </text>
  
  <!-- Bottom Specs -->
  <g transform="translate(100, 490)">
    <rect width="1000" height="60" rx="12" fill="rgba(13,18,30,0.8)" stroke="rgba(255,255,255,0.08)"/>
    <text x="30" y="36" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="700">01 CAPTURE</text>
    <text x="150" y="36" fill="#64748B" font-family="monospace" font-size="14">→</text>
    <text x="200" y="36" fill="#818CF8" font-family="monospace" font-size="14" font-weight="700">02 UNDERSTAND</text>
    <text x="360" y="36" fill="#64748B" font-family="monospace" font-size="14">→</text>
    <text x="410" y="36" fill="#FBBF24" font-family="monospace" font-size="14" font-weight="700">03 TRANSFORM</text>
    <text x="570" y="36" fill="#64748B" font-family="monospace" font-size="14">→</text>
    <text x="620" y="36" fill="#34D399" font-family="monospace" font-size="14" font-weight="700">04 DISTRIBUTE</text>
    <text x="820" y="36" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">KNCA Labs</text>
  </g>
</svg>
